<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — WOODORA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="admin-body">

<div class="auth-split">
  <div class="auth-media" style="background:var(--dark-brown);">
    <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=1200&auto=format&fit=crop" alt="Woodora workshop">
    <p class="auth-quote">WOODORA Admin — for the people who keep the workshop running.</p>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="index.html" class="brand">WOOD<span>ORA</span></a>
      <span class="eyebrow" style="margin-bottom:0.6rem; display:inline-flex;">Admin Panel</span>
      <h2 style="font-size:1.8rem; margin-bottom:0.4rem;">Sign in to the dashboard.</h2>
      <p style="margin-bottom:2rem;">Authorized staff only.</p>

      <div class="field"><label>Admin Email</label><input type="email" placeholder="admin@woodora.example"></div>
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
      <a href="admin-dashboard.html" class="btn btn-primary btn-block">Sign In <span class="arrow">→</span></a>
      <p class="auth-alt"><a href="index.html">← Back to store</a></p>
    </div>
  </div>
</div>

</body>
</html>
